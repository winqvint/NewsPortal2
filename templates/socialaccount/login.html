<!DOCTYPE html>
<html>
<head>
    <title>Вход через социальные сети</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 450px;
            width: 100%;
            padding: 2rem;
        }

        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .page-title {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .provider-info {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border-left: 4px solid #3498db;
        }

        .provider-name {
            color: #2c3e50;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .provider-description {
            color: #6c757d;
            font-size: 0.95rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            width: 100%;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .back-link {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 2px solid #e9ecef;
        }

        .back-link a {
            color: #6c757d;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-link a:hover {
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="page-title">Вход через социальные сети</h1>

            <div class="provider-info">
                {% if process == "connect" %}
                    <h3 class="provider-name">Подключить {{ provider.name }}</h3>
                    <p class="provider-description">Подключите ваш аккаунт {{ provider.name }} к профилю</p>
                {% else %}
                    <h3 class="provider-name">Войти через {{ provider.name }}</h3>
                    <p class="provider-description">Быстрый и безопасный вход</p>
                {% endif %}
            </div>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Продолжить</button>
            </form>

            <div class="back-link">
                <a href="/accounts/login/">← Назад к входу</a>
            </div>
        </div>
    </div>
</body>
</html>
